<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>CNT</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="style.css" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var t = localStorage.getItem("cnt-theme");
        if (t === "clair")
          document.documentElement.setAttribute("data-theme", "light");
        if (t === "sombre")
          document.documentElement.setAttribute("data-theme", "dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="splash" class="splash" aria-hidden="true">
      <img
        src="logo-cnt.jpg"
        alt="Compagnie Nationale de Transport"
        class="splash-logo"
      />
    </div>
    <!--
<div id="splash" class="splash" aria-hidden="true">
  <img src="logo-cnt.png" alt="Compagnie Nationale de Transport" class="splash-logo" />
</div>
-->
    <div id="app"></div>
    <button
      class="options-btn"
      id="optionsBtn"
      type="button"
      aria-label="Options"
    >
      <span></span><span></span><span></span>
    </button>
    <div class="options-menu" id="optionsMenu">
      <button type="button" data-action="profil">Mon profil</button>
      <button type="button" data-action="favoris">Mes favoris</button>
      <button type="button" data-action="notifications">Notifications</button>
      <button type="button" data-action="aide">Aide</button>
        
  <p class="gris" style="text-align:center;margin-top:24px;font-size:11px;">CNT Mobile v1.0 · © 2026 Judaxe Kevin NGUIAMBAMBA</p>
</div>
    </div>
    <nav class="bottom-nav">
      <div class="nav-track" id="navTrack">
        <div class="nav-indicator" id="navIndicator"></div>
        <button class="nav-item active" data-v="home" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
          </svg>
          <span>Accueil</span>
        </button>
        <button class="nav-item" data-v="trajet" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="7" r="3" />
            <path d="M12 10v8" />
            <path d="M9 15l3 3 3-3" />
          </svg>
          <span>Trajet</span>
        </button>
        <button class="nav-item" data-v="reseau" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="10" />
            <path
              d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
            />
          </svg>
          <span>Réseau</span>
        </button>
        <button class="nav-item" data-v="lignes" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect x="3" y="6" width="18" height="12" rx="2" />
            <path d="M6 10h.01" />
            <path d="M18 10h.01" />
            <path d="M6 14h12" />
          </svg>
          <span>Lignes</span>
        </button>
        <button class="nav-item" data-v="billets" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path
              d="M2 9a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3v1a3 3 0 0 0-3 3 3 3 0 0 0 3 3v1a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3v-1a3 3 0 0 0 3-3 3 3 0 0 0-3-3V9z"
            />
          </svg>
          <span>Billets</span>
        </button>
      </div>
    </nav>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="app.js"></script>
    <script src="extras.js"></script>
    <!-- © 2026 NGUIAMBAMBA Judaxe Kevin — Prototype CNT Mobile — Tous droits réservés -->
  </body>
</html>
